services:

  db:
    image: mysql:${DB_VERSION:-5.7}
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-prestashop}
      MYSQL_USER: ${DB_USER:-prestashop}
      MYSQL_PASSWORD: ${DB_PASSWORD:-prestashop}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  prestashop:
    image: prestashop/prestashop:${PS_VERSION:-9}
    environment:
      DB_SERVER: db
      DB_NAME: ${DB_NAME:-prestashop}
      DB_USER: ${DB_USER:-prestashop}
      DB_PASSWD: ${DB_PASSWORD:-prestashop}
      PS_DEV_MODE: ${PS_DEV_MODE:-1}
      PS_INSTALL_AUTO: ${PS_INSTALL_AUTO:-1}
      PS_DOMAIN: ${PS_DOMAIN:-localhost:${PS_HTTP_PORT:-80}}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PS_HTTP_PORT:-80}:80"
    volumes:
      - ./prestashop/${PS_VERSION:-9}:/var/www/html

volumes:
  database:
